name: BOOK.NOW founder dashboard checks

on:
  pull_request:
    branches: [main]
    paths:
      - "founder.html"
      - "sw.js"
      - ".github/workflows/founder-dashboard-checks.yml"
  push:
    branches: [main]
    paths:
      - "founder.html"
      - "sw.js"
      - ".github/workflows/founder-dashboard-checks.yml"

permissions:
  contents: read

jobs:
  founder-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate founder dashboard JavaScript and pagination
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, tempfile
          source = pathlib.Path("founder.html").read_text(encoding="utf-8")
          worker = pathlib.Path("sw.js").read_text(encoding="utf-8")
          subprocess.run(["node", "--check", "sw.js"], check=True)
          if "CORE_PATHS.has(url.pathname)" not in worker or "await cache.put(cacheKey, response.clone())" not in worker:
              raise SystemExit("Founder service worker cache regression detected.")
          if "event.waitUntil(caches.open(CACHE)" in worker:
              raise SystemExit("Founder service worker must not attach cache writes after fetch dispatch.")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script\s*>", source, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("No inline founder dashboard script found.")
          for index, script in enumerate(scripts):
              if not script.strip():
                  continue
              path = pathlib.Path(tempfile.gettempdir()) / f"founder-dashboard-{index}.js"
              path.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
          required = [
              'id="load-more-bookings-btn"',
              '.range(offset,offset+BOOKING_PAGE_SIZE-1)',
              '.range(offset,offset+499)',
              '.rpc("founder_list_subscription_payment_requests")',
              'bookingHasMore',
              'Load older bookings'
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit("Founder pagination regression: missing " + ", ".join(missing))
          print("Founder dashboard syntax and pagination checks passed.")
          PY
